<div class="character-arch">
  <div class="character-arch__petals" aria-hidden="true">
    @for (petal of petals; track petal) {
      <span></span>
    }
  </div>
  <div class="character-arch__hearts" aria-hidden="true">
    @for (heart of hearts(); track heart.id) {
      <span
        class="character-arch__heart"
        [style.left]="heart.left + '%'"
        [style.top]="heart.top + '%'"
        [style.--heart-drift]="heart.drift + 'px'">
        &#9829;
      </span>
    }
  </div>
  <picture (pointerdown)="emitHeart($event)">
    <source type="image/webp" [srcset]="$safeNavigationMigration(content()?.COUPLE_IMAGE_WEBP)">
    <img [id]="$safeNavigationMigration(content()?.COUPLE_IMAGE_ID)" [alt]="$safeNavigationMigration(content()?.COUPLE_IMAGE_ALT)"
      [title]="$safeNavigationMigration(content()?.COUPLE_IMAGE_TITLE)" [src]="$safeNavigationMigration(content()?.COUPLE_IMAGE_PATH)" />
  </picture>
</div>
<h1 id="character-intro">
  <picture>
    <source type="image/webp" [srcset]="$safeNavigationMigration(content()?.COUPLE_NAME_WEBP)">
    <img [id]="$safeNavigationMigration(content()?.COUPLE_NAME_ID)" [alt]="$safeNavigationMigration(content()?.COUPLE_NAME_ALT)"
      [title]="$safeNavigationMigration(content()?.COUPLE_NAME_TITLE)" [src]="$safeNavigationMigration(content()?.COUPLE_NAME_PATH)" />
  </picture>
</h1>
